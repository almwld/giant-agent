name: giant_agent_x
description: AI Agent with TFLite Models
version: 6.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  file_picker: ^6.0.0
  image_picker: ^1.0.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  share_plus: ^7.2.2
  cross_file: ^0.3.3+2
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  xterm: ^3.5.0
  webview_flutter: ^4.5.0
  lottie: ^3.1.2
  http: ^1.1.0
  flutter_local_notifications: 16.3.3
  timezone: ^0.9.2
  flutter_secure_storage: 9.0.0
  google_ml_kit: ^0.16.3
  tflite_flutter: 0.10.4
  connectivity_plus: 5.0.2
  translator: ^1.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/giant_agent_icon.svg
    - assets/animations/smart_speaker.json
