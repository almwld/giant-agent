name: sherpa_onnx_web
description: Android-only dependency stub for sherpa_onnx web platform resolution.
version: 1.13.8
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

flutter:
  plugin:
    platforms:
      web:
        pluginClass: SherpaOnnxWeb
        fileName: sherpa_onnx_web.dart
