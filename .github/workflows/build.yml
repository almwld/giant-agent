name: Build Giant Agent APK

on:
  push:
    branches:
      - main
      - feat/integrated-agent-completion
      - feat/phase-0-durable-agent-service
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Install parser test dependency
        run: python -m pip install pypdf==4.2.0 reportlab==4.2.0

      - name: Test PDF DOCX XLSX parser
        run: |
          cd android/app/src/main/python
          python -m unittest -v test_document_parser

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint architecture Markdown
        run: npx --yes markdownlint-cli2@0.17.2 --config .markdownlint-cli2.jsonc "docs/architecture/*.md"

      - name: Analyze runtime foundation and Gain PTY
        run: flutter analyze lib/domain/kernel lib/domain/terminal lib/tools/gain_terminal_tool.dart lib/tools/terminal_tool_coordinator.dart lib/services/model_service.dart lib/screens/chat_screen.dart

      - name: Test durable kernel FIFO and recovery
        run: flutter test test/domain/kernel/agent_kernel_test.dart

      - name: Test AgentService durable execution boundary
        run: flutter test test/services/agent_service_durable_test.dart

      - name: Test TaskManager SQLite migration and recovery
        run: flutter test test/agent/task_manager_recovery_test.dart

      - name: Test Gain PTY output protocol
        run: flutter test test/domain/terminal/gain_command_output_parser_test.dart

      - name: Test approval-bound Gain terminal harness
        run: flutter test test/tools/terminal_tool_coordinator_test.dart

      - name: Analyze all Flutter and Dart sources
        run: flutter analyze --no-pub

      - name: Run Flutter unit tests
        run: flutter test --no-pub

      # Do not use --split-per-abi: Chaquopy requires ndk.abiFilters.
      # Build each ABI in its own Flutter invocation instead.
      - name: Build universal release APK
        run: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Build arm64-v8a release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk

      - name: Build armeabi-v7a release APK
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-armeabi-v7a-release.apk

      - name: Build x86_64 release APK
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-x86_64-release.apk

      - name: Verify APK outputs and checksums
        run: |
          set -e
          test -s dist/giant-agent-universal.apk
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-armeabi-v7a-release.apk
          test -s dist/app-x86_64-release.apk
          echo "APK files produced:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: 📤 Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-universal-release
          path: dist/giant-agent-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: dist/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: dist/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: dist/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
