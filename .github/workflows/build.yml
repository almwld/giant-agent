name: Build Giant Agent APK

on:
  push:
    branches:
      - integration/complete-runtime-consolidation-v2-20261114
      - feat/agentsos-control-center
      - main
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
      - fix/voice-terminal-approval-stabilization
      - fix/openrouter-only-provider-policy
      - feat/voice-orb-in-chat-session
      - feat/chat-bubble-resize-teal-toasts
      - feat/local-offline-voice-pipeline
      - integration/unified-agent-runtime-v2
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - integration/unified-agent-runtime-v2
      - main
      - feat/kimi-subagent-orchestration
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
      - chore/boosthis-mcp-mainline
      - feat/local-offline-voice-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Patch flutter_whisper native WAV decoder
        run: python3 tool/patch_flutter_whisper.py

      - name: Analyze all Flutter and Dart sources
        run: flutter analyze --no-pub

      # Do not use --split-per-abi: Chaquopy requires ndk.abiFilters.
      # Build each ABI in its own Flutter invocation instead.
      - name: Build universal release APK
        run: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Build arm64-v8a release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk

      - name: Build armeabi-v7a release APK
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-armeabi-v7a-release.apk

      - name: Build x86_64 release APK
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-x86_64-release.apk

      - name: Verify Gain PTY JNI and Lottie assets inside APKs
        run: |
          set -euo pipefail
          verify_native() {
            apk="$1"
            abi="$2"
            unzip -l "$apk" | grep -q "lib/$abi/libgain_pty.so" || {
              echo "Missing Gain PTY native library for $abi in $apk"
              exit 1
            }
          }
          verify_native dist/app-arm64-v8a-release.apk arm64-v8a
          verify_native dist/app-armeabi-v7a-release.apk armeabi-v7a
          verify_native dist/app-x86_64-release.apk x86_64
          unzip -l dist/giant-agent-universal.apk | grep -q "assets/flutter_assets/assets/animations/voice_orb.json"
          for apk in dist/*.apk; do
            unzip -p "$apk" classes.dex 2>/dev/null | strings | grep -q "GainPtyBridge" || {
              echo "GainPtyBridge class not found in $apk"
              exit 1
            }
          done

      - name: Verify APK outputs and checksums
        run: |
          set -e
          test -s dist/giant-agent-universal.apk
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-armeabi-v7a-release.apk
          test -s dist/app-x86_64-release.apk
          echo "APK files produced:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: 📤 Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-universal-release
          path: dist/giant-agent-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: dist/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: dist/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: dist/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      # Optional cloud-device upload. Set APPETIZE_ENABLED=true and configure APPETIZE_API_KEY in GitHub Actions secrets.
      - name: Upload universal APK to Appetize
        id: appetize
        if: ${{ vars.APPETIZE_ENABLED == 'true' && github.event_name != 'pull_request' }}
        uses: appetizeio/github-action-appetize@v1.1.0
        continue-on-error: true
        env:
          APPETIZE_API_KEY: ${{ secrets.APPETIZE_API_KEY }}
        with:
          apiToken: ${{ secrets.APPETIZE_API_KEY }}
          publicKey: ${{ secrets.APPETIZE_PUBLIC_KEY }}
          appFile: dist/giant-agent-universal.apk
          platform: android
          note: Giant Agent - GitHub Actions build ${{ github.run_number }}
          timeout: '600'

      - name: Publish Appetize test link
        if: ${{ steps.appetize.outputs.publicKey != '' }}
        env:
          APPETIZE_PUBLIC_KEY: ${{ steps.appetize.outputs.publicKey }}
        run: |
          echo "## Appetize cloud device" >> "$GITHUB_STEP_SUMMARY"
          echo "Launch the Android build in your browser: https://appetize.io/app/$APPETIZE_PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"
          echo "Appetize public key: $APPETIZE_PUBLIC_KEY" >> "$GITHUB_STEP_SUMMARY"

  gain-pty-emulator:
    name: Android emulator Gain PTY smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run cold-launch and Gain PTY smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -cores 2 -memory 4096
          disable-animations: true
          script: flutter test integration_test/gain_pty_emulator_smoke_test.dart -d emulator-5554
