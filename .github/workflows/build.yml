name: Build Giant Agent APK

on:
  push:
    branches:
      - integration/complete-runtime-consolidation-v2-20261114
      - feat/agentsos-control-center
      - main
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
      - fix/voice-terminal-approval-stabilization
      - fix/openrouter-only-provider-policy
      - feat/voice-orb-in-chat-session
      - feat/chat-bubble-resize-teal-toasts
      - feat/local-offline-voice-pipeline
      - integration/unified-agent-runtime-v2
      - integration/complete-runtime-consolidation-v2-20261114
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - integration/unified-agent-runtime-v2
      - main
      - feat/kimi-subagent-orchestration
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
      - chore/boosthis-mcp-mainline
      - feat/local-offline-voice-pipeline
      - integration/complete-runtime-consolidation-v2-20261114
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate deterministic Arabic WAV smoke fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng sox
          mkdir -p integration_test/fixtures
          espeak-ng -v ar -s 125 -w integration_test/fixtures/arabic_smoke_raw.wav "السلام عليكم"
          sox integration_test/fixtures/arabic_smoke_raw.wav -r 16000 -c 1 -b 16 -e signed-integer integration_test/fixtures/arabic_smoke.wav
          rm integration_test/fixtures/arabic_smoke_raw.wav
          test "$(soxi -r integration_test/fixtures/arabic_smoke.wav)" = "16000"
          test "$(soxi -c integration_test/fixtures/arabic_smoke.wav)" = "1"
          test "$(soxi -b integration_test/fixtures/arabic_smoke.wav)" = "16"
          file integration_test/fixtures/arabic_smoke.wav
          od -An -tx1 -N44 integration_test/fixtures/arabic_smoke.wav
          test -s integration_test/fixtures/arabic_smoke.wav

      - name: Patch flutter_whisper native WAV decoder
        run: python3 tool/patch_flutter_whisper.py

      - name: Analyze all Flutter and Dart sources
        run: flutter analyze --no-pub

      - name: Prepare split APK output directory
        run: mkdir -p dist

      - name: Build arm64-v8a release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk

      - name: Build armeabi-v7a release APK
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-armeabi-v7a-release.apk

      - name: Build x86_64 release APK
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-x86_64-release.apk

      - name: Verify Gain PTY JNI and Lottie assets inside APKs
        run: |
          set -euo pipefail
          verify_native() {
            apk="$1"
            abi="$2"
            unzip -l "$apk" | grep -q "lib/$abi/libgain_pty.so" || {
              echo "Missing Gain PTY native library for $abi in $apk"
              exit 1
            }
          }
          verify_native dist/app-arm64-v8a-release.apk arm64-v8a
          verify_native dist/app-armeabi-v7a-release.apk armeabi-v7a
          verify_native dist/app-x86_64-release.apk x86_64
          verify_whisper() {
            apk="$1"
            abi="$2"
            unzip -l "$apk" | grep -q "lib/$abi/libwhisper.so" || {
              echo "Missing upstream Whisper engine libwhisper.so for $abi in $apk"
              exit 1
            }
            unzip -l "$apk" | grep -q "lib/$abi/libwhisper_jni.so" || {
              echo "Missing JNI bridge libwhisper_jni.so for $abi in $apk"
              exit 1
            }
            unzip -l "$apk" | grep -q "lib/$abi/libggml.so" || {
              echo "Missing Whisper runtime dependency libggml.so for $abi in $apk"
              exit 1
            }
          }
          verify_whisper dist/app-arm64-v8a-release.apk arm64-v8a
          verify_whisper dist/app-armeabi-v7a-release.apk armeabi-v7a
          verify_whisper dist/app-x86_64-release.apk x86_64
          # Split APKs stay compact; speech weights are installed once after app setup.
          for apk in dist/app-arm64-v8a-release.apk dist/app-armeabi-v7a-release.apk dist/app-x86_64-release.apk; do
            size=$(stat -c%s "$apk")
            if [ "$size" -gt $((140 * 1024 * 1024)) ]; then
              echo "Split APK exceeds the 140 MiB diagnostic ceiling: $apk ($size bytes)"
              exit 1
            fi
          done
          echo "===== APK COMPRESSED CONTENT BREAKDOWN ====="
          for apk in dist/app-arm64-v8a-release.apk dist/app-armeabi-v7a-release.apk dist/app-x86_64-release.apk; do
            echo "--- $apk ---"
            unzip -l "$apk" | sort -nr | head -n 30
          done
          for apk in dist/*.apk; do
            unzip -l "$apk" | grep -q "assets/flutter_assets/assets/animations/voice_orb.json" || {
              echo "Voice orb Lottie asset missing from $apk"
              exit 1
            }
            if unzip -l "$apk" | grep -Eq "assets/flutter_assets/assets/voice_models/(ggml-base[.]bin|nabra-82m-arabic-int8[.]tar[.]bz2)"; then
              echo "Large offline speech weights must stay outside the install APK: $apk"
              exit 1
            fi
            dex_found=false
            while IFS= read -r dex; do
              if unzip -p "$apk" "$dex" 2>/dev/null | strings | grep -q "GainPtyBridge"; then
                dex_found=true
                break
              fi
            done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex')
            if [ "$dex_found" != true ]; then
              echo "GainPtyBridge reference not found in any DEX file in $apk"
              exit 1
            fi
          done

      - name: Verify APK outputs and checksums
        run: |
          set -e
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-armeabi-v7a-release.apk
          test -s dist/app-x86_64-release.apk
          echo "APK files produced:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: 📤 Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: dist/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: dist/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: dist/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30


  gain-pty-emulator:
    name: Android emulator Gain PTY and Whisper Arabic inference smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy emulator build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify emulator Chaquopy Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate deterministic Arabic WAV inference fixture
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng sox
          mkdir -p integration_test/fixtures
          espeak-ng -v ar -s 125 -w integration_test/fixtures/arabic_smoke_raw.wav "السلام عليكم"
          sox integration_test/fixtures/arabic_smoke_raw.wav -r 16000 -c 1 -b 16 -e signed-integer integration_test/fixtures/arabic_smoke.wav
          rm integration_test/fixtures/arabic_smoke_raw.wav
          test "$(soxi -r integration_test/fixtures/arabic_smoke.wav)" = "16000"
          test "$(soxi -c integration_test/fixtures/arabic_smoke.wav)" = "1"
          test "$(soxi -b integration_test/fixtures/arabic_smoke.wav)" = "16"
          file integration_test/fixtures/arabic_smoke.wav
          od -An -tx1 -N44 integration_test/fixtures/arabic_smoke.wav
          test -s integration_test/fixtures/arabic_smoke.wav

      - name: Provision Whisper.cpp native engine for emulator ABI
        run: |
          set -euo pipefail
          python3 tool/patch_flutter_whisper.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import unquote, urlparse
          config = Path('.dart_tool/package_config.json')
          packages = json.loads(config.read_text())['packages']
          entry = next(p for p in packages if p['name'] == 'flutter_whisper')
          uri = urlparse(entry['rootUri'])
          root = Path(unquote(uri.path)) if uri.scheme == 'file' else (config.parent / entry['rootUri']).resolve()
          native = root / 'android/src/main/cpp/whisper_jni.cpp'
          cmake = root / 'third_party/whisper.cpp/CMakeLists.txt'
          plugin_cmake = root / 'android/src/main/cpp/CMakeLists.txt'
          context = root / 'android/src/main/kotlin/io/github/govindtank/flutter_whisper/WhisperContext.kt'
          gradle = root / 'android/build.gradle'
          native_source = native.read_text()
          assert native.is_file() and 'GIANT_AGENT_WAV_ONLY_DECODER' in native_source
          assert 'OUTPUT_NAME whisper_jni' in plugin_cmake.read_text(), 'JNI bridge must not collide with upstream libwhisper.so'
          assert 'System.loadLibrary("whisper_jni")' in context.read_text(), 'Kotlin must load the distinct JNI bridge'
          for method in ('nativeInit', 'nativeTranscribe', 'nativeCancel', 'nativeFree'):
              assert f'Java_io_github_govindtank_flutter_1whisper_WhisperContext_{method}' in native_source, f'JNI export is not correctly mangled: {method}'
          assert cmake.is_file(), 'whisper.cpp native source tree was not provisioned'
          assert 'x86_64' in gradle.read_text(), 'emulator ABI is missing from Whisper plugin filters'
          print('WHISPER_NATIVE_READY: patched JNI + whisper.cpp sources + x86_64 ABI')
          PY

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run cold-launch and Gain PTY smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          cores: 4
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -cores 4 -memory 6144
          disable-animations: true
          script: |
            set +e
            flutter test integration_test/gain_pty_emulator_smoke_test.dart -d emulator-5554
            pty_status=$?
            flutter test integration_test/whisper_arabic_emulator_smoke_test.dart -d emulator-5554
            whisper_status=$?
            test_status=$((pty_status || whisper_status))
            echo "===== WHISPER / ANDROID LINKER LOGCAT ====="
            adb -s emulator-5554 logcat -d -v threadtime | grep -E -i 'WHISPER_|FlutterWhisper|UnsatisfiedLinkError|dlopen failed|linker|whisper|ggml' | tail -n 300 || true
            echo "===== DEBUG APK NATIVE LIBRARY CONTENTS ====="
            debug_apk=build/app/outputs/flutter-apk/app-debug.apk
            test ! -f "$debug_apk" || unzip -Z1 "$debug_apk" | grep -E "^lib/(x86_64|arm64-v8a)/lib(whisper|whisper_jni|ggml.*)[.]so$" | sort || true
            test -f "$debug_apk" || test_status=1
            test ! -f "$debug_apk" || unzip -p "$debug_apk" lib/x86_64/libwhisper_jni.so > /tmp/libwhisper_jni.so || test_status=1
            for method in nativeInit nativeTranscribe nativeCancel nativeFree; do
              symbol="Java_io_github_govindtank_flutter_1whisper_WhisperContext_${method}"
              readelf -Ws /tmp/libwhisper_jni.so 2>/dev/null | grep -F "$symbol" || test_status=1
            done
            exit "$test_status"

      - name: Inspect packaged Whisper JNI symbols even after smoke-test failure
        if: always()
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          if [ ! -f "$apk" ]; then
            echo "Debug APK was not produced; cannot inspect Whisper JNI exports."
            exit 1
          fi
          unzip -Z1 "$apk" | grep -E "^lib/x86_64/lib(whisper|whisper_jni)[.]so$" | sort
          unzip -p "$apk" lib/x86_64/libwhisper_jni.so > /tmp/libwhisper_jni.so
          echo "===== DYNAMIC JNI SYMBOLS IN PACKAGED libwhisper_jni.so ====="
          readelf -Ws /tmp/libwhisper_jni.so | grep -E "Java_io_github_govindtank_flutter(_1)?whisper_WhisperContext_native" || true
