name: Build Giant Agent APK

on:
  push:
    branches:
      - main
      - feat/sehatak-brand-identity
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Install parser test dependency
        run: pip install pypdf python-docx openpyxl

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Lint architecture Markdown
        run: |
          python - <<'PY'
          from pathlib import Path
          files = list(Path('docs').rglob('*.md')) if Path('docs').exists() else []
          for path in files:
              text = path.read_text(encoding='utf-8')
              if '\\x00' in text:
                  raise SystemExit(f'NUL byte in {path}')
          print(f'Checked {len(files)} architecture Markdown files')
          PY

      - name: Analyze all Flutter and Dart sources
        run: flutter analyze

      - name: Run Flutter unit tests
        run: flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Verify APK output and checksum
        run: |
          set -e
          test -s dist/giant-agent-universal.apk
          echo "APK file produced:"
          ls -lh dist/giant-agent-universal.apk
          sha256sum dist/giant-agent-universal.apk | tee dist/SHA256SUMS.txt

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-universal-release
          path: dist/giant-agent-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
