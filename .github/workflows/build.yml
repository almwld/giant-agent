name: Build Giant Agent APK

on:
  push:
    branches:
      - main
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
      - fix/voice-terminal-approval-stabilization
      - fix/openrouter-only-provider-policy
      - feat/voice-orb-in-chat-session
      - test/gain-pty-emulator-smoke
      - feat/chat-bubble-resize-teal-toasts
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches:
      - main
      - feat/kimi-subagent-orchestration
      - feat/integrated-agent-completion
      - feat/consolidate-sqlite-runtime-v2
      - integration/giant-agent-stabilization
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Install parser test dependency
        run: python -m pip install pypdf==4.2.0 reportlab==4.2.0

      - name: Test PDF DOCX XLSX parser
        run: |
          cd android/app/src/main/python
          python -m unittest -v test_document_parser

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test AgentService durable execution boundary
        run: flutter test test/services/agent_service_durable_test.dart

      - name: Test approved voice orb Lottie asset and states
        run: flutter test test/voice/voice_orb_lottie_test.dart

      - name: Test TaskManager SQLite migration and recovery
        run: flutter test test/agent/task_manager_recovery_test.dart

      - name: Analyze all Flutter and Dart sources
        run: flutter analyze --no-pub

      - name: Run Flutter unit tests
        run: flutter test --no-pub

      # Do not use --split-per-abi: Chaquopy requires ndk.abiFilters.
      # Build each ABI in its own Flutter invocation instead.
      - name: Build universal release APK
        run: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Build arm64-v8a release APK
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk

      - name: Build armeabi-v7a release APK
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-armeabi-v7a-release.apk

      - name: Build x86_64 release APK
        run: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-x86_64-release.apk

      - name: Verify Gain PTY JNI and Lottie assets inside APKs
        run: |
          set -euo pipefail
          verify_native() {
            apk="$1"
            abi="$2"
            unzip -l "$apk" | grep -q "lib/$abi/libgain_pty.so" || {
              echo "Missing Gain PTY native library for $abi in $apk"
              exit 1
            }
          }
          verify_native dist/giant-agent-universal.apk arm64-v8a
          verify_native dist/giant-agent-universal.apk armeabi-v7a
          verify_native dist/giant-agent-universal.apk x86_64
          verify_native dist/app-arm64-v8a-release.apk arm64-v8a
          verify_native dist/app-armeabi-v7a-release.apk armeabi-v7a
          verify_native dist/app-x86_64-release.apk x86_64
          for apk in dist/*.apk; do
            unzip -l "$apk" | grep -q "assets/flutter_assets/assets/animations/voice_orb.json" || {
              echo "Voice orb Lottie asset missing from $apk"
              exit 1
            }
            dex_found=false
            while IFS= read -r dex; do
              if unzip -p "$apk" "$dex" 2>/dev/null | strings | grep -q "GainPtyBridge"; then
                dex_found=true
                break
              fi
            done < <(unzip -Z1 "$apk" | grep -E '^classes([0-9]+)?[.]dex')
            if [ "$dex_found" != true ]; then
              echo "GainPtyBridge reference not found in any DEX file in $apk"
              exit 1
            fi
          done
      - name: Verify APK outputs and checksums
        run: |
          set -e
          test -s dist/giant-agent-universal.apk
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-armeabi-v7a-release.apk
          test -s dist/app-x86_64-release.apk
          echo "APK files produced:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: Report APK component sizes
        run: |
          set -e
          for apk in dist/*.apk; do
            echo "===== Largest uncompressed entries: $apk ====="
            unzip -l "$apk" | awk 'NR > 3 && $1 ~ /^[0-9]+$/ { print $1, $4 }' | sort -nr | head -25
            echo "===== Native library sizes: $apk ====="
            unzip -l "$apk" | awk 'substr($4,1,4)=="lib/" && substr($4,length($4)-2)==".so" { print $1, $4 }' | sort -nr | head -20
          done

      - name: 📤 Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-universal-release
          path: dist/giant-agent-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: dist/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: dist/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload x86_64
        uses: actions/upload-artifact@v4
        with:
          name: app-x86_64-release
          path: dist/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  gain-pty-emulator:
    name: Android emulator Gain PTY smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run cold-launch and Gain PTY smoke test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot -wipe-data -cores 2 -memory 4096
          disable-animations: true
          script: flutter test integration_test/gain_pty_emulator_smoke_test.dart -d emulator-5554
