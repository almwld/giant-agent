name: Build Giant Agent APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: giant-agent-apk-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python for Chaquopy
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Chaquopy build Python
        run: |
          python --version
          python3.11 --version
          command -v python3.11

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze timeline implementation
        run: >-
          flutter analyze
          lib/core/timeline_engine.dart
          lib/core/tool_cancellation_manager.dart
          lib/data/timeline_database.dart
          lib/widgets/advanced_timeline_widget.dart
          lib/examples/timeline_example.dart
          test/timeline_engine_test.dart

      - name: Run timeline unit tests
        run: flutter test --no-pub test/timeline_engine_test.dart

      - name: Build universal release APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Verify APK outputs
        run: |
          set -e
          test -s dist/giant-agent-universal.apk
          echo "APK files produced:"
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

      - name: 📤 Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-universal-release
          path: dist/giant-agent-universal.apk
          if-no-files-found: error
          retention-days: 30

      - name: 📤 Upload SHA256 checksums
        uses: actions/upload-artifact@v4
        with:
          name: giant-agent-sha256-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
