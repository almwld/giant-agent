name: Giant Agent Assistant Foundation CI

on:
  push:
    branches:
      - feat/chatgpt-experience-foundation
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart sources
        run: flutter analyze lib/features/assistant lib/screens/chat_screen.dart
      - name: Run Flutter tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug

  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate gateway syntax
        run: node --check src/server.mjs
      - name: Run gateway unit tests
        run: npm test
