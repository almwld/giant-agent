def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Chaquopy requires Android ndk.abiFilters. Flutter's --split-per-abi
// also configures ABI splits, which Gradle does not allow alongside filters.
// Build one target platform per invocation and align Chaquopy to that target.
def flutterTargetPlatforms = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64')
        .toString().split(',')
def chaquopyAbis = flutterTargetPlatforms.collect { platform ->
    switch (platform.trim()) {
        case 'android-arm': return 'armeabi-v7a'
        case 'android-arm64': return 'arm64-v8a'
        case 'android-x64': return 'x86_64'
        default: throw new GradleException("Unsupported Flutter Android target platform: ${platform}")
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    externalNativeBuild {
        cmake {
            path file("src/main/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.example.giant_agent"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk { abiFilters(*chaquopyAbis) }
        python { version "3.11"; pip { install "pypdf==4.2.0" } }
    }

    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
}

flutter { source '../..' }

// Download and pin the large offline speech weights at build time. The files
// are Flutter assets in the APK, then copied to private model caches on first use.
def bundledVoiceModelDir = rootProject.file("../assets/voice_models")
def prepareVoiceModels = tasks.register("prepareVoiceModels") {
    outputs.files(
        new File(bundledVoiceModelDir, "ggml-base.bin"),
        new File(bundledVoiceModelDir, "nabra-82m-arabic-int8.tar.bz2")
    )
    doLast {
        bundledVoiceModelDir.mkdirs()
        def downloadPinned = { String source, File destination, String expectedSha, Long expectedSize ->
            def sha256 = { File file ->
                def digest = java.security.MessageDigest.getInstance("SHA-256")
                file.withInputStream { input ->
                    byte[] buffer = new byte[1024 * 1024]
                    int read
                    while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
                }
                digest.digest().collect { String.format("%02x", it & 0xff) }.join()
            }
            if (destination.exists() &&
                (expectedSize == null || destination.length() == expectedSize) &&
                sha256(destination) == expectedSha) return
            if (destination.exists()) destination.delete()
            File partial = new File(destination.parentFile, destination.name + ".part")
            if (partial.exists()) partial.delete()
            logger.lifecycle("Downloading bundled offline voice model: ${destination.name}")
            def connection = new URL(source).openConnection()
            connection.connectTimeout = 30000
            connection.readTimeout = 180000
            connection.setRequestProperty("User-Agent", "GiantAgent-Android-Build/1.0")
            connection.getInputStream().withCloseable { input ->
                partial.withOutputStream { output ->
                    byte[] buffer = new byte[1024 * 1024]
                    int read
                    while ((read = input.read(buffer)) > 0) output.write(buffer, 0, read)
                }
            }
            if (expectedSize != null && partial.length() != expectedSize) {
                def actualSize = partial.length()
                partial.delete()
                throw new GradleException("Wrong size for ${destination.name}: ${actualSize}")
            }
            def actualSha = sha256(partial)
            if (actualSha != expectedSha) {
                partial.delete()
                throw new GradleException("SHA-256 mismatch for ${destination.name}: ${actualSha}")
            }
            if (!partial.renameTo(destination)) {
                java.nio.file.Files.move(partial.toPath(), destination.toPath(),
                    java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
            logger.lifecycle("Verified ${destination.name}: ${destination.length()} bytes / ${actualSha}")
        }
        downloadPinned(
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin",
            new File(bundledVoiceModelDir, "ggml-base.bin"),
            "60ed5bc3dd14eea856493d334349b405782ddcaf0028d4b5df4088345fba2efe",
            147951465L
        )
        downloadPinned(
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/nabra-82m-arabic-int8.tar.bz2",
            new File(bundledVoiceModelDir, "nabra-82m-arabic-int8.tar.bz2"),
            "e7c644fabb1529190de9a2f7d6044f88c26bf6d9b717ad41ef5d2b748e01459b",
            null
        )
    }
}
tasks.configureEach { candidate ->
    if (candidate.name.startsWith("compileFlutterBuild")) {
        candidate.dependsOn(prepareVoiceModels)
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
