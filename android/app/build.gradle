def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

// Chaquopy requires Android ndk.abiFilters. Flutter's --split-per-abi
// also configures ABI splits, which Gradle does not allow alongside filters.
// Build one target platform per invocation and align Chaquopy to that target.
def flutterTargetPlatforms = (project.findProperty('target-platform') ?: 'android-arm,android-arm64,android-x64')
        .toString().split(',')
def chaquopyAbis = flutterTargetPlatforms.collect { platform ->
    switch (platform.trim()) {
        case 'android-arm': return 'armeabi-v7a'
        case 'android-arm64': return 'arm64-v8a'
        case 'android-x64': return 'x86_64'
        default: throw new GradleException("Unsupported Flutter Android target platform: ${platform}")
    }
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

android {
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions { jvmTarget = '1.8' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    externalNativeBuild {
        cmake {
            path file("src/main/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.example.giant_agent"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk { abiFilters(*chaquopyAbis) }
        python { version "3.11"; pip { install "pypdf==4.2.0" } }
    }

    buildTypes {
        release { signingConfig signingConfigs.debug }
    }
}

flutter { source '../..' }

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.9'
}
