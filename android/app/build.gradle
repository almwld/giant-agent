def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'
apply plugin: 'kotlin-android'
apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"

// Build each ABI independently in CI. This avoids the conflict between
// Android's ABI split mechanism and Chaquopy's required ndk.abiFilters.
def allAndroidAbis = ["armeabi-v7a", "arm64-v8a", "x86_64", "x86"]
def requestedChaquopyAbis = System.getenv("CHAQUOPY_ABI_FILTERS")
def chaquopyAbis = requestedChaquopyAbis
    ? requestedChaquopyAbis.split(",").collect { it.trim() }.findAll { it }
    : allAndroidAbis
def invalidAbis = chaquopyAbis.findAll { !allAndroidAbis.contains(it) }
if (chaquopyAbis.isEmpty() || !invalidAbis.isEmpty()) {
    throw new GradleException("Invalid CHAQUOPY_ABI_FILTERS: ${requestedChaquopyAbis}")
}

android {
    compileSdk 34
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    externalNativeBuild {
        cmake {
            path file("src/main/CMakeLists.txt")
            version "3.22.1"
        }
    }

    defaultConfig {
        applicationId "com.example.giant_agent"
        minSdk 26
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk {
            // Chaquopy requires these filters. CI narrows this list for
            // each architecture-specific APK instead of using --split-per-abi.
            abiFilters(*chaquopyAbis)
        }
        python { version "3.11" }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.core:core-ktx:1.12.0'
}
