workflows:
  android-release:
    name: Giant Agent Android Release (Flutter 3.16.0)
    max_build_duration: 60
    instance_type: linux_x2

    environment:
      flutter: 3.16.0
      java: 17

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: feat/consolidate-sqlite-runtime-v2
          include: true
          source: true
        - pattern: ci/codemagic-android-release
          include: true
          source: true

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Verify Java, Flutter, and Chaquopy Python
        script: |
          java -version
          flutter --version
          python3.11 --version
          command -v python3.11

      - name: Install document parser test dependencies
        script: |
          python3.11 -m pip install --user pypdf==4.2.0 reportlab==4.2.0

      - name: Test PDF DOCX XLSX parser
        script: |
          cd android/app/src/main/python
          python3.11 -m unittest -v test_document_parser

      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Test AgentService durable execution boundary
        script: flutter test test/services/agent_service_durable_test.dart

      - name: Test TaskManager SQLite migration and recovery
        script: flutter test test/agent/task_manager_recovery_test.dart

      - name: Analyze all Flutter and Dart sources
        script: flutter analyze --no-pub

      - name: Run Flutter unit tests
        script: flutter test --no-pub

      # Do not use --split-per-abi: Chaquopy requires ndk.abiFilters.
      # Build each ABI in a separate Flutter invocation, matching build.yml.
      - name: Build universal release APK
        script: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/giant-agent-universal.apk

      - name: Build arm64-v8a release APK
        script: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-arm64-v8a-release.apk

      - name: Build armeabi-v7a release APK
        script: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-armeabi-v7a-release.apk

      - name: Build x86_64 release APK
        script: |
          flutter build apk --release --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-release.apk dist/app-x86_64-release.apk

      - name: Verify APK outputs and generate SHA256 checksums
        script: |
          set -e
          test -s dist/giant-agent-universal.apk
          test -s dist/app-arm64-v8a-release.apk
          test -s dist/app-armeabi-v7a-release.apk
          test -s dist/app-x86_64-release.apk
          ls -lh dist/*.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt

    artifacts:
      - dist/*.apk
      - dist/SHA256SUMS.txt
